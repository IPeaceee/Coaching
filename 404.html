<script>
  // This page is served for any missing URL, at any depth, so relative links need a fixed base.
  // On a GitHub Pages project site the first path segment is the repository (e.g. /Coaching/).
  // Assets are added from script so the browser never fetches them relative to the missing URL.
  (function () {
    var seg = location.pathname.split("/")[1];
    var base = /\.github\.io$/i.test(location.hostname) && seg ? "/" + seg + "/" : "/";
    var head = document.head;
    function add(tag, attrs) { var el = document.createElement(tag); for (var k in attrs) el.setAttribute(k, attrs[k]); head.appendChild(el); }
    add("base", { href: base });
    add("link", { rel: "icon", href: base + "assets/images/logo.svg", type: "image/svg+xml" });
    add("link", { rel: "stylesheet", href: base + "assets/css/academy.css" });
    try { var t = localStorage.getItem("coaching-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  })();
</script>
</head>
