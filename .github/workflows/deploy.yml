name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links, assets and courses.json
        run: node tools/check-site.mjs

      # Publish the whole repository root (every course folder), minus development files.
      - name: Stage site
        run: |
          mkdir _site
          rsync -a --exclude='.git*' --exclude='.github' --exclude='tools' --exclude='_site' \
                --exclude='README.md' ./ _site/
          touch _site/.nojekyll
          echo "Published files:" && (cd _site && find . -type f | sort)

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
